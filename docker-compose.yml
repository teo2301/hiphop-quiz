# Optional LOCAL-ONLY static copy of the site. The scores API is NOT here:
# all three quizzes use /mnt/ssdstorage/share/quiz-shared (see tools/PUBLISH.md).
services:
  hiphop-quiz:
    image: nginx:alpine
    container_name: hiphop-quiz
    restart: unless-stopped
    ports:
      - "127.0.0.1:8092:80"
    volumes:
      - ./docs:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
